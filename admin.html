<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Coffee Ratings · Add</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=10311530">
</head>
<body class="admin">
  <nav class="topbar">
    <a class="mark" href="./">Coffee Ratings</a>
    <div class="links">
      <a href="./">Site</a>
      <a href="#" id="signOut" hidden>Sign out</a>
    </div>
  </nav>

  <main>
    <form id="signIn" hidden>
      <h1 class="eyebrow">Sign in</h1>
      <div class="field"><label for="email">Username</label><input type="text" id="email" autocomplete="username" autocapitalize="none" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required></div>
      <p class="err" id="signInErr" hidden></p>
      <button class="btn" type="submit">Sign in</button>
    </form>

    <section id="panel" hidden>
      <form id="coffeeForm" autocomplete="off">
        <h1 class="eyebrow" id="formTitle">Add a coffee</h1>
        <div class="field"><label for="date">Date</label><input type="date" id="date" required></div>
        <div class="field"><label for="cafe">Café</label><input type="text" id="cafe" list="cafes" maxlength="120" required></div>
        <div class="field"><label for="order">Coffee</label><input type="text" id="order" maxlength="160" placeholder="V60 pour-over" required></div>
        <div class="field"><label for="beans">Beans</label><input type="text" id="beans" maxlength="160" placeholder="Ethiopia Guji · natural"></div>
        <div class="field"><label for="description">Description</label><textarea id="description" maxlength="2000"></textarea></div>
        <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap">
          <button class="btn" type="submit" id="saveBtn">Add</button>
          <button class="btn-line" type="button" id="cancelEdit" hidden>Cancel</button>
        </div>
      </form>
      <datalist id="cafes"></datalist>
    </section>

    <section id="listBox" hidden>
      <h2 class="eyebrow" style="margin-bottom:16px">Coffees</h2>
      <div class="admin-list" id="list"></div>
    </section>
  </main>
  <div class="toast" id="toast" hidden></div>

  <script>window.CR_ADMIN = true;</script>
  <script src="js/config.js?v=10311530"></script>
  <script src="js/ui.js?v=10311530"></script>
  <script src="js/store.js?v=10311530"></script>
  <script src="js/admin.js?v=10311530"></script>
</body>
</html>
